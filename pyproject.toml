[tool.briefcase]
project_name = "Kim Audio Separator"
bundle = "org.rabee"
version = "1.0"
app_author = "Rabee Mareh"
license = { file = "LICENSE" }
summary = "Offline Android application for vocal isolation"
sources = ['src']
test_sources = ['tests']
requires = [
    "kivymd",
    "flask",
