name: Build Android App with Briefcase

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk git zip unzip

    - name: Install Briefcase
      run: |
        pip install --upgrade pip
        pip install briefcase

    - name: Create Android Template and Build
      run: |
        briefcase create android
        briefcase build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: briefcase-apk
        path: android/gradle/app/build/outputs/apk/debug/*.apk
