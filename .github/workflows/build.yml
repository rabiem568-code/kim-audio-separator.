name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git lib32stdc++6 lib32z1 libncurses5:i386 \
          libstdc++6:i386 zlib1g-dev openjdk-17-jdk unzip wget curl \
          autoconf libtool pkg-config zlib1g-dev libssl-dev libffi-dev \
          libltdl-dev libsqlite3-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --user --upgrade cython==0.29.36 buildozer

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
